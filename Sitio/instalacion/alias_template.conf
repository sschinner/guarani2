# Este template permite tener instalado en diferentes alias las diferentes unidades
# académicas y también define de manera centralizada todo el manejo de nombres en los dominios

Alias /veterinaria "/path/to/projects/g3w2/src/siu/www"
Alias /medicina "/path/to/projects/g3w2/src/siu/www"

<Directory "/path/to/projects/g3w2/src/siu/www">
	Options FollowSymLinks
    DirectoryIndex index.php
    <IfModule !mod_authz_core.c>
            Order allow,deny
        Allow from all
    </IfModule>
    <IfModule mod_authz_core.c>
        Require all granted
    </IfModule>

	AddDefaultCharset ISO-8859-1
	include /path/to/projects/g3w2/instalacion/rewrite.conf
</Directory>

<Location /veterinaria>
	# representa el id interno de la unidad académica. Se correponde con la entrada
	# en el archivo config.yml ua_<ACC_ID>. Ej: ua_VET
    SetEnv ACC_ID des01

	# se setea de esta manera para que esta variable sea accesible desde mod_rewrite
	# ATENCIÃÓN: el alias debe empezar con '/'
	SetEnvIf always_match ^ ACC_ALIAS=/veterinaria
</Location>

<Location /medicina>
	SetEnv ACC_ID test01
	SetEnvIf always_match ^ ACC_ALIAS=/medicina
</Location>